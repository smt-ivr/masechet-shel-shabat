name = "masechet-shel-shabat"
main = "worker.js"
compatibility_date = "2024-05-24"

# קבצי האתר (HTML / CSS / JS) מיובאים כמחרוזות — הם רצים בדפדפן, לא ב-Worker
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/v2/*.js"]
fallthrough = true

# קבצים בינאריים (תמונות / אייקון) מיובאים כ-ArrayBuffer
[[rules]]
type = "Data"
globs = ["**/*.png", "**/*.ico"]
fallthrough = true

# מסד הנתונים של מסכת של שבת – טבלאות עם הקידומת ms_ בתוך המסד yemot-pay (משותף).
# כל הטוקנים והמפתחות (ימות, נדרים, Resend, Google) שמורים במסד בטבלה ms_settings –
# לא במשתני סביבה. עריכה בדף הניהול: https://smti.uk/masechet/admin
[[d1_databases]]
binding = "DB"
database_name = "yemot-pay"
database_id = "dd8bf73b-6dca-446d-a929-e467025ceac7"
